[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efenova-ablation"
version = "0.1.0"
description = "列出实验因素组合，标出未覆盖的组合与无法归因的设计"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "efenova" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://efenova.github.io"
Repository = "https://github.com/efenova/ablation"
Issues = "https://github.com/efenova/ablation/issues"

[project.scripts]
ablation = "ablation:main"

[tool.setuptools]
py-modules = ["ablation"]
